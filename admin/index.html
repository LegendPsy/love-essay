<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0b0d0f">
<title>LegendPsy · Админ-панель</title>
<style>
:root{
  --bg:#0b0d0f;--panel:#121517;--panel2:#171b1e;--paper:#ece4d8;--muted:#9f9a93;
  --gold:#d3a05e;--red:#d36f62;--green:#81b98c;--line:rgba(236,228,216,.12);
}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;min-height:100vh;background:
radial-gradient(circle at 50% -20%,rgba(211,160,94,.12),transparent 34%),var(--bg)}
button,input,textarea{font:inherit}
button{cursor:pointer}
.wrap{width:min(1100px,calc(100% - 28px));margin:0 auto;padding:24px 0 72px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
.brand{font-size:1.15rem;font-weight:750;letter-spacing:.02em}
.back{color:var(--muted);text-decoration:none;font-size:.9rem}
.panel{border:1px solid var(--line);background:rgba(18,21,23,.88);border-radius:22px;padding:clamp(18px,4vw,30px);box-shadow:0 24px 70px rgba(0,0,0,.25)}
.auth{max-width:520px;margin:10vh auto 0}
h1{font-size:clamp(2rem,7vw,4rem);line-height:.95;margin:0 0 10px}
.sub{color:var(--muted);line-height:1.6;margin:0 0 24px}
.form{display:grid;gap:13px}
label{font-size:.77rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
input,textarea{
  width:100%;border:1px solid var(--line);background:#0d0f10;color:var(--paper);
  border-radius:14px;padding:13px 14px;outline:none
}
input:focus,textarea:focus{border-color:rgba(211,160,94,.7);box-shadow:0 0 0 3px rgba(211,160,94,.08)}
.btn{border:1px solid rgba(211,160,94,.5);background:rgba(211,160,94,.12);color:var(--paper);border-radius:999px;padding:11px 16px;font-weight:700}
.btn.secondary{border-color:var(--line);background:rgba(255,255,255,.035);font-weight:600}
.btn.danger{border-color:rgba(211,111,98,.45);background:rgba(211,111,98,.1);color:#ffd8d2}
.btn:disabled{opacity:.45;cursor:default}
.note{color:var(--muted);font-size:.88rem;line-height:1.5;min-height:1.35em}
.setup{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.setup summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.hidden{display:none!important}
.dash-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px}
.dash-head h1{font-size:clamp(2rem,6vw,3.6rem)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:16px;padding:14px}
.stat b{display:block;font-size:1.55rem}.stat span{color:var(--muted);font-size:.8rem}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:18px 0}
.filters{display:flex;gap:7px;flex-wrap:wrap}
.filter{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 11px}
.filter.active{color:var(--paper);border-color:rgba(211,160,94,.5);background:rgba(211,160,94,.08)}
.list{display:grid;gap:12px}
.card{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:18px;padding:16px}
.card.hidden-comment{opacity:.66}
.meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px;color:var(--muted);font-size:.77rem}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.hidden-comment .dot{background:var(--red)}
.comment-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.58;margin:0 0 13px}
.editor{min-height:120px;resize:vertical;margin:0 0 12px}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}
.statusbar{margin:12px 0;color:var(--muted);font-size:.85rem;min-height:1.2em}
@media(max-width:700px){
  .toolbar{grid-template-columns:1fr}.dash-head{display:grid}.stats{grid-template-columns:1fr 1fr 1fr}
  .meta{align-items:flex-start;flex-direction:column}.card-actions .btn{flex:1}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">LegendPsy · Admin</div>
    <a class="back" href="../">← К статье</a>
  </div>

  <section id="authView" class="auth panel">
    <h1>Вход</h1>
    <p class="sub">Управление комментариями. Пароль нигде на сайте не хранится.</p>
    <form id="loginForm" class="form">
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button id="loginBtn" class="btn" type="submit">Войти</button>
      <div id="loginNote" class="note" role="status"></div>
    </form>

    <details class="setup">
      <summary>Первый вход: создать учётную запись</summary>
      <form id="signupForm" class="form" style="margin-top:14px">
        <div><label for="signupEmail">Email</label><input id="signupEmail" type="email" autocomplete="email" required></div>
        <div><label for="signupPassword">Новый пароль</label><input id="signupPassword" type="password" autocomplete="new-password" minlength="12" required></div>
        <button id="signupBtn" class="btn secondary" type="submit">Создать учётную запись</button>
        <div id="signupNote" class="note" role="status"></div>
      </form>
    </details>
  </section>

  <section id="dashboard" class="hidden">
    <div class="dash-head">
      <div>
        <h1>Комментарии</h1>
        <p class="sub" style="margin-bottom:0">Редактирование, скрытие и удаление сообщений читателей.</p>
      </div>
      <div class="actions">
        <button id="refreshBtn" class="btn secondary">Обновить</button>
        <button id="logoutBtn" class="btn secondary">Выйти</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><b id="totalCount">0</b><span>всего</span></div>
      <div class="stat"><b id="visibleCount">0</b><span>видимых</span></div>
      <div class="stat"><b id="hiddenCount">0</b><span>скрытых</span></div>
    </div>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Поиск по тексту…">
      <div class="filters">
        <button class="filter active" data-filter="all">Все</button>
        <button class="filter" data-filter="visible">Видимые</button>
        <button class="filter" data-filter="hidden">Скрытые</button>
      </div>
    </div>

    <div id="statusbar" class="statusbar" role="status"></div>
    <div id="commentsList" class="list"></div>
  </section>
</div>

<script>
(()=>{
  const SUPABASE_URL='https://eswoqjxioavegjnhosbb.supabase.co';
  const KEY='sb_publishable_Czx1d7slcJQgqhjOS0miWw_Na2Yrnvb';
  const ADMIN_URL=SUPABASE_URL+'/functions/v1/admin-comments';
  const $=s=>document.querySelector(s);
  const $$=s=>[...document.querySelectorAll(s)];
  const authView=$('#authView'), dashboard=$('#dashboard');
  const loginForm=$('#loginForm'), signupForm=$('#signupForm');
  const loginNote=$('#loginNote'), signupNote=$('#signupNote'), statusbar=$('#statusbar');
  const list=$('#commentsList'), search=$('#search');
  let comments=[],filter='all';

  function getSession(){
    try{return JSON.parse(sessionStorage.getItem('legendpsy_admin_session')||'null')}catch(_){return null}
  }
  function setSession(s){sessionStorage.setItem('legendpsy_admin_session',JSON.stringify(s))}
  function clearSession(){sessionStorage.removeItem('legendpsy_admin_session')}
  function authHeaders(token){
    return {'apikey':KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'};
  }
  async function refreshSession(){
    const s=getSession(); if(!s?.refresh_token) return null;
    const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:s.refresh_token})
    });
    if(!r.ok){clearSession();return null}
    const next=await r.json();setSession(next);return next;
  }
  async function adminCall(payload,retry=true){
    let s=getSession(); if(!s?.access_token) throw new Error('unauthorized');
    let r=await fetch(ADMIN_URL,{method:'POST',headers:authHeaders(s.access_token),body:JSON.stringify(payload)});
    if(r.status===401 && retry){
      s=await refreshSession();
      if(s) return adminCall(payload,false);
    }
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(data.error||('http_'+r.status));
    return data;
  }
  function showAuth(msg=''){
    authView.classList.remove('hidden');dashboard.classList.add('hidden');
    if(msg)loginNote.textContent=msg;
  }
  function showDashboard(){
    authView.classList.add('hidden');dashboard.classList.remove('hidden');
  }
  function dateLabel(value){
    try{return new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value))}
    catch(_){return value||''}
  }
  function counts(){
    $('#totalCount').textContent=comments.length;
    $('#visibleCount').textContent=comments.filter(x=>x.is_visible).length;
    $('#hiddenCount').textContent=comments.filter(x=>!x.is_visible).length;
  }
  function filtered(){
    const q=search.value.trim().toLowerCase();
    return comments.filter(c=>{
      const f=filter==='all'||(filter==='visible'&&c.is_visible)||(filter==='hidden'&&!c.is_visible);
      const s=!q||c.body.toLowerCase().includes(q);
      return f&&s;
    });
  }
  function render(){
    counts();list.replaceChildren();
    const rows=filtered();
    if(!rows.length){
      const e=document.createElement('div');e.className='empty';e.textContent='Ничего не найдено.';list.append(e);return;
    }
    rows.forEach(c=>{
      const card=document.createElement('article');card.className='card'+(c.is_visible?'':' hidden-comment');
      const meta=document.createElement('div');meta.className='meta';
      const badge=document.createElement('span');badge.className='badge';
      const dot=document.createElement('i');dot.className='dot';
      const label=document.createElement('span');label.textContent=c.is_visible?'Видимый':'Скрытый';
      badge.append(dot,label);
      const date=document.createElement('span');date.textContent=dateLabel(c.created_at);
      meta.append(badge,date);

      const text=document.createElement('p');text.className='comment-text';text.textContent=c.body;
      const editor=document.createElement('textarea');editor.className='editor hidden';editor.value=c.body;editor.maxLength=2000;

      const actions=document.createElement('div');actions.className='card-actions';
      const vis=document.createElement('button');vis.className='btn secondary';vis.textContent=c.is_visible?'Скрыть':'Показать';
      const edit=document.createElement('button');edit.className='btn secondary';edit.textContent='Редактировать';
      const del=document.createElement('button');del.className='btn danger';del.textContent='Удалить';
      actions.append(vis,edit,del);

      vis.onclick=()=>mutate(async()=>{
        const data=await adminCall({action:'set_visibility',id:c.id,is_visible:!c.is_visible});
        Object.assign(c,data.comment);render();
      });

      let editing=false;
      edit.onclick=()=>mutate(async()=>{
        if(!editing){
          editing=true;text.classList.add('hidden');editor.classList.remove('hidden');edit.textContent='Сохранить';editor.focus();return;
        }
        const body=editor.value.trim();
        if(!body){statusbar.textContent='Комментарий не может быть пустым.';return}
        const data=await adminCall({action:'edit',id:c.id,body});
        Object.assign(c,data.comment);editing=false;text.classList.remove('hidden');editor.classList.add('hidden');edit.textContent='Редактировать';render();
      });

      del.onclick=()=>mutate(async()=>{
        if(!confirm('Удалить комментарий навсегда? Это действие нельзя отменить.'))return;
        await adminCall({action:'delete',id:c.id});
        comments=comments.filter(x=>x.id!==c.id);render();
      });

      card.append(meta,text,editor,actions);list.append(card);
    });
  }
  async function mutate(fn){
    statusbar.textContent='Сохраняю…';
    try{await fn();statusbar.textContent='Готово.'}
    catch(e){statusbar.textContent='Ошибка: '+friendly(e.message)}
  }
  function friendly(code){
    const map={
      unauthorized:'Сессия закончилась. Войди снова.',
      forbidden:'Этот аккаунт ещё не получил права администратора.',
      invalid_comment:'Проверь текст комментария.',
      update_failed:'Не удалось сохранить изменения.',
      delete_failed:'Не удалось удалить комментарий.'
    };
    return map[code]||'Не удалось выполнить действие.';
  }
  async function load(){
    statusbar.textContent='Загружаю…';
    try{
      const data=await adminCall({action:'list'});
      comments=data.comments||[];showDashboard();render();statusbar.textContent='';
    }catch(e){
      if(e.message==='forbidden'){showAuth('Аккаунт существует, но права администратора ещё не активированы.')}
      else{clearSession();showAuth(friendly(e.message))}
    }
  }

  loginForm.addEventListener('submit',async e=>{
    e.preventDefault();loginNote.textContent='Вхожу…';$('#loginBtn').disabled=true;
    try{
      const email=$('#email').value.trim(),password=$('#password').value;
      const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{
        method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},
        body:JSON.stringify({email,password})
      });
      const data=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error('login_failed');
      setSession(data);await load();
    }catch(_){loginNote.textContent='Не удалось войти. Проверь email, пароль и подтверждение почты.'}
    finally{$('#loginBtn').disabled=false}
  });

  signupForm.addEventListener('submit',async e=>{
    e.preventDefault();signupNote.textContent='Создаю…';$('#signupBtn').disabled=true;
    try{
      const email=$('#signupEmail').value.trim(),password=$('#signupPassword').value;
      if(password.length<12)throw new Error('weak');
      const r=await fetch(SUPABASE_URL+'/auth/v1/signup',{
        method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},
        body:JSON.stringify({email,password})
      });
      const data=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(data?.msg||'signup_failed');
      signupNote.textContent=data?.session
        ? 'Учётная запись создана. Теперь нужно активировать права администратора.'
        : 'Учётная запись создана. Проверь почту и подтверди email. После этого права администратора нужно активировать.';
    }catch(e){signupNote.textContent=e.message==='weak'?'Пароль должен быть не короче 12 символов.':'Не удалось создать учётную запись.'}
    finally{$('#signupBtn').disabled=false}
  });

  $('#refreshBtn').onclick=load;
  $('#logoutBtn').onclick=()=>{clearSession();showAuth('Ты вышел из админ-панели.')};
  search.addEventListener('input',render);
  $$('.filter').forEach(b=>b.onclick=()=>{
    filter=b.dataset.filter;$$('.filter').forEach(x=>x.classList.toggle('active',x===b));render();
  });

  if(getSession())load();
})();
</script>
</body>
</html>
